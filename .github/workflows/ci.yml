name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}

      # The package declares no dependencies at all: the checks and the build
      # are plain node:fs/node:test, so there is nothing to install.
      #
      # `verify` is the offline half of the project's own routine:
      #   test -> check:source-tracked -> check:bundle -> check:ui
      #        -> check:acceptance -> check:package -> check:install
      # The live probes (check:autonomy, check:notices, check:memory,
      # check:tools, check:grant-bypass, verify:live, drill:*) are deliberately
      # NOT here: every one of them is chained behind require-fresh-host.mjs and
      # needs a running DSH host with this tree loaded, which a CI runner is not.
      - name: npm run verify (the offline half)
        run: npm run verify
